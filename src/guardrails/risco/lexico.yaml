# Léxico do detector de risco (RF-IA03). Classificação: proposta técnica.
# Revisado pela equipe em 10/11/2026, sem profissional de saúde (não houve acesso a um).
# Qualquer mudança aqui deve ser revisada no PR e medida em eval/risco/casos.json.
#
# As expressões regulares são aplicadas ao texto em minúsculas e sem acentos.
# O detector prioriza o recall (meta >= 0,95): na dúvida, a mensagem de acolhimento aparece.
# Por isso não há tratamento de negação: "não aguento mais viver" contém "não" e é sinal de risco.
# `excecao` descarta a regra quando o texto também casa com ela (por exemplo, vômito por intoxicação).

versao: 1
revisao: equipe
categorias:
  ideacao_suicida:
    - '\b(me|se) matar\b'
    - '\bmatar-me\b'
    - '\bsuicid'
    - '\b(quero|queria|vou) morrer\b'
    - '\bprefiro morrer\b'
    - '\bse eu morresse\b'
    - '\btirar (a )?(minha )?(propria )?vida\b'
    - '\bacabar com (a )?minha (propria )?vida\b'
    - '\bnao (aguento|quero|consigo) mais viver\b'
    - '\bcansad[oa] de viver\b'
    - '\bsentido (em|de) (continuar )?viv'
    - '\b(a )?vida nao vale (mais )?a pena\b'
    - '\b(dormir|deitar) e nao acordar\b'
    - '\b(mundo|todos|familia) (seria|ficaria|ficariam|seriam) melhor(es)? sem mim\b'
    - '\b(sentiria|sentiriam) (a )?minha falta\b'
    - '\bsumir para sempre\b'
    - '\bdesaparecer (e nunca mais|para sempre)\b'
    - '\bnao quero mais estar aqui\b'
    - '\b(dar um fim|por um fim|acabar) (em|com) tudo\b'
    - '\bcarta de despedida\b'
    - '\b(dose|quantidade|remedio|remedios).{0,30}\bque mata\b'
    - '\bdesisti de (tudo|viver)\b'
    # Ampliação pedida na revisão do PR #41: "não aguento mais" sem objeto, desejo de não existir,
    # falta de saída, métodos e frases em inglês.
    - '\bnao aguento mais\s*($|[.,!?;]|e\b|quero\b|de verdade\b)'
    - '\b(estar|ser|ficar) mort[oa]\b'
    - '\bse eu (sumisse|desaparecesse|nao existisse|partisse)\b'
    - '\bnao (existisse|existir mais|tivesse nascido|ter nascido)\b'
    - '\b(sentir|ia sentir|iam sentir|vai sentir|sentiria|sentiriam) (a )?(minha )?falta\b'
    - '\b(sem|nao vejo|nao tem|nao ha|nao tenho) (mais )?saida\b'
    - '\bme (jogar|atirar) (da|do|de|na|no|em|na frente)\b'
    - '\bpular (da|do|de) (ponte|predio|janela|viaduto|sacada|laje)\b'
    - '\benforc'
    - '\boverdose\b'
    - '\btodos os (remedios|comprimidos)\b'
    - '\b(a cartela|a caixa) (inteira|toda) de (remedio|remedios|comprimidos)\b'
    - '\b(kill myself|want to die|end my life|suicide|suicidal)\b'
    - '\bsou (um|uma) (peso|fardo) (para|pra)\b'
  autolesao:
    - '\bme (corto|cortar|cortei|cortando)\b'
    - '\bcortes? n[oa]s? (braco|bracos|perna|pernas|pulso|pulsos|coxa|coxas)\b'
    - '\bme (machuc\w*|ferir|firo|feri|ferindo|queim\w*|arranh\w*|belisc\w*|castig\w*|punir|puno)\b'
    - '\bautoles'
    - '\bautomutil'
    - '\bbat(o|er) (a|com a) cabeca na parede\b'
    - '\b(cortar|abrir|corto|cortei) (os |meus |o |meu )?pulsos?\b'
    - '\bme odeio\b'
    - '\bmereco sofrer\b'
    - '\b(self[- ]?harm|cut myself|hurt myself)\b'
  comportamento_alimentar_de_risco:
    - padrao: '\bvomit\w* (depois|apos) (de )?(comer|cada refeicao|as refeicoes)\b'
      excecao: '\b(estragad\w*|intoxicac\w*|virose|enjoo|gravidez|alergia)\b'
    - '\b(provoc\w*|induz\w*) (o )?vomit'
    - '\bforc\w* a vomitar\b'
    - '\bvomit\w* escondid'
    - '\bdedo na garganta\b'
    - '\b(colocar|por|botar) tudo (para|pra) fora\b'
    - '\b(laxante|diuretico)s?\b.{0,60}\b(emagrec\w*|perder peso|nao engordar|secar|pesagem|perder \d+ ?kg)\b'
    - '\b(emagrec\w*|perder peso|nao engordar)\b.{0,60}\b(laxante|diuretico)s?\b'
    - '\blaxantes? todo dia\b'
    - '\bdias sem comer\b'
    - '\bpasso o dia (todo|inteiro) sem comer\b'
    - '\b(para|pra) nao comer\b'
    - '\bvomit\w* tudo (que|o que)\b'
    - '\blaxantes? por dia\b'
    - '\b\d+ laxantes\b'
    - '\bsem comer\b.{0,40}\b(emagrec\w*|perder peso|nao engordar|secar)\b'
    - '\b(emagrec\w*|perder peso|nao engordar)\b.{0,40}\bsem comer\b'
    - '\b(fico|passo) sem comer\b'
    - '\bdias (so|apenas) (bebendo|tomando) agua\b'
    - '\bso (bebendo|tomando) agua\b.{0,40}\b(emagrec\w*|perder peso|secar)\b'
    - '\bparar de comer de vez\b'
    - '\b(paro|deixo|parei|deixei) de comer\b(?! (doce|doces|carne|acucar|pao|fritura|ultraprocessad))'
    - '\bso (uma|um|1) \w+ por dia\b'
    - '\bate desmaiar\b'
    - '\bdesmaiei de fome\b'
    - '\bmastig\w* e cusp'
    - '\bremedio (para|pra) (tirar|inibir|cortar) a fome\b'
    - '\bjejum (de agua )?(por|de) (uma|1|duas|2|tres|3) semanas?\b'
    - '\b(pavor|medo) de comer\b'
    - '\bodeio (o )?meu corpo\b'
    - '\bnojent[oa] depois de comer\b'
    - '\bcompensar o que comi\b'
