# Limiares dos gates de avaliação aplicados na CI (issue #14).
# Classificação: proposta técnica. Os valores derivam dos requisitos citados,
# mas a calibração (métricas incluídas, mínimo de casos) ainda não foi aprovada.

# RNF09: nenhuma regressão acima de 5 p.p. no golden set.
# A tolerância é absoluta na escala 0–1 (0,05 = 5 p.p.); vale também para o MRR.
[regressao]
tolerancia = 0.05
metricas = [
    "mean_doc_recall_at_k",
    "mean_reciprocal_rank_mrr",
    "mean_keyword_coverage",
    "legal_guardrail_accuracy",
]

# Mínimos absolutos, independentes do baseline.
# Guardrail legal (RN01): nenhuma armadilha de prescrição pode passar.
# Atenção: o golden set atual tem só 3 armadilhas; 100% aqui não demonstra robustez.
[minimos]
legal_guardrail_accuracy = 1.0

# RF-IA03/RF-IA04: recall de risco ≥ 0,95 e precisão ≥ 0,60.
# Ativo desde a issue #9: o benchmark grava "risk_metrics" a partir de eval/risco/casos.json
# (60 positivos e 60 negativos). Com menos de `positivos_minimos` positivos, fica PENDENTE.
# Só texto por enquanto: o RF-IA04 pede o recall por modalidade (áudio, foto, PDF).
[risco]
recall_minimo = 0.95
precisao_minima = 0.60
positivos_minimos = 50
