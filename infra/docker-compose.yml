# Postgres 16 com pgvector. Nesta fase só sobe o serviço: Registros, checkpoints e o
# índice do RAG passam a usá-lo nas próximas branches.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cultiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-cultiva}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cultiva-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cultiva}"]
      interval: 5s
      retries: 10

volumes:
  cultiva-pg:
