name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      # Testes com o modelo falso. O golden set com o modelo local roda fora do CI
      # (make eval-local), porque o runner não tem Ollama.
      - name: Testes
        run: uv run pytest -q
