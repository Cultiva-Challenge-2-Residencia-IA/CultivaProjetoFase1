# CI da issue #14: lint, testes, integridade do corpus e gates de avaliação.
# Roda sem chaves de API: o benchmark usa síntese extrativa local, para ser determinístico.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.16"
  PYTHON_VERSION: "3.11"
  # Garante execução offline: sem Groq e sem Ollama.
  GROQ_API_KEY: ""
  LLM_PROVIDER: ollama
  ALLOW_EXTERNAL_LLM: "false"
  # Modelo de embeddings em pasta fixa, para o cache do job de avaliação (issue #15).
  FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
  VETORES_CACHE: data/vector_store/vetores_cache.sqlite3

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check --output-format=github .

  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      # Os testes usam o modelo de embeddings de teste (hashing, tests/conftest.py): sem baixar o
      # e5-large nem calcular vetores. Os testes que dependem do modelo real (marca embeddings_reais)
      # rodam no job de avaliação, que tem o modelo e os vetores pré-calculados.
      # Modelo OCR do Tesseract para os testes da imagem (issue #96); o mesmo do pipeline do corpus,
      # conferido pelo SHA-256 de corpus/scripts/convert_pdfs.py; a URL fixa o commit do tessdata_fast.
      - name: Modelo OCR (por.traineddata)
        run: |
          mkdir -p corpus/.cache/tessdata
          curl -fsSL -o corpus/.cache/tessdata/por.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/923915d4ced2a7235221788285785a29c4a42d4a/por.traineddata
          echo "c4932b937207a9514b7514d518b931a99938c02a28a5a5a553f8599ed58b7deb  corpus/.cache/tessdata/por.traineddata" | sha256sum -c -
      - run: uv run pytest -q

  corpus:
    name: Integridade do corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ambiente do pipeline de corpus
        run: |
          uv venv --python "$PYTHON_VERSION" .venv-corpus
          uv pip install --python .venv-corpus -r corpus/scripts/requirements.txt
      - name: verify_corpus.py (não aprova conteúdo)
        run: .venv-corpus/bin/python corpus/scripts/verify_corpus.py

  avaliacao:
    name: Gates de avaliação
    runs-on: ubuntu-latest
    # Com os vetores pré-calculados, o job leva poucos minutos. O limite cobre a primeira execução
    # sem cache; se ela estourar, os lotes já calculados são salvos e a próxima continua de onde parou.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      # Vetores pré-calculados (issue #15, ADR 0006). O e5-large (2,2 GB) em CPU leva dezenas de
      # minutos para indexar o corpus do zero, o que não cabe num CI de PR. O CI da main salva o cache
      # dos vetores; os PRs restauram o cache mais recente (o próprio, ou o da main) e só calculam os
      # Trechos novos ou alterados. A chave de cada vetor é o hash do modelo e do texto
      # (CacheDeVetores), então um cache antigo nunca devolve vetor errado.
      - name: Restaurar o modelo de embeddings
        id: modelo
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          # Sem o uv.lock na chave: o modelo não muda com as dependências, e cada cópia tem 2,2 GB.
          # Troque o sufixo (v1) se mudar o modelo ou a versão do fastembed mudar o formato.
          key: fastembed-multilingual-e5-large-v1
          # Reserva: o cache do modelo gravado com a chave anterior (por uv.lock).
          restore-keys: fastembed-
      - name: Restaurar os vetores pré-calculados
        id: vetores
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VETORES_CACHE }}
          key: vetores-e5-${{ github.run_id }}
          # Reserva: o cache gravado com a chave anterior; a chave de cada vetor (modelo e texto) é a mesma.
          restore-keys: |
            vetores-e5-
            vetores-avaliacao-
      - name: Pré-calcular os vetores dos Trechos
        run: |
          if [ -z "${{ steps.vetores.outputs.cache-matched-key }}" ]; then
            echo "::warning title=Sem vetores pré-calculados::nenhum cache da main ou deste PR; os vetores de todo o corpus serão calculados (dezenas de minutos em CPU)"
          fi
          echo "VETORES_SHA_ANTES=$(sha256sum "$VETORES_CACHE" 2>/dev/null | cut -c1-64)" >> "$GITHUB_ENV"
          uv run python -m src.retrieval.precalcular_vetores | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Testes com o modelo de embeddings real (marca embeddings_reais)
        env:
          CULTIVA_TESTES_EMBEDDINGS_REAIS: "true"
        run: uv run pytest -m embeddings_reais -q

      # A primeira execução só constrói o índice HNSW do ChromaDB e é descartada. As duas
      # seguintes usam o mesmo índice persistido, então o gate de determinismo compara o
      # pipeline (BM25, fusão, reranker e síntese), não a construção do índice aproximado.
      # A qualidade do HNSW frente à busca exata é coberta pelos testes de embeddings_reais acima.
      - name: Construir o índice vetorial
        run: uv run python -m src.evaluation.run_benchmark --no-ollama > /dev/null

      - name: Benchmark offline (duas execuções no mesmo índice)
        run: |
          uv run python -m src.evaluation.run_benchmark --no-ollama
          cp data/benchmark/baseline_report.json "$RUNNER_TEMP/execucao1.json"
          uv run python -m src.evaluation.run_benchmark --no-ollama > /dev/null

      - name: Determinismo do golden set
        run: |
          if ! cmp -s "$RUNNER_TEMP/execucao1.json" data/benchmark/baseline_report.json; then
            echo "::error title=Benchmark não determinístico::duas execuções seguidas produziram relatórios diferentes"
            diff "$RUNNER_TEMP/execucao1.json" data/benchmark/baseline_report.json | head -40
            exit 1
          fi

      # Em PRs, a régua é o baseline da branch de destino: editar o baseline no próprio PR
      # não afrouxa o gate. Se o destino ainda não tiver baseline, usa o do PR.
      - name: Baseline de referência
        env:
          BASE_REF: ${{ github.base_ref }}
          BASELINE: eval/baselines/benchmark_offline.json
        run: |
          if [ -n "$BASE_REF" ] \
            && git fetch --quiet --depth=1 origin "$BASE_REF" \
            && git show "FETCH_HEAD:$BASELINE" > "$RUNNER_TEMP/baseline.json" 2>/dev/null; then
            echo "Baseline: $BASE_REF"
          else
            cp "$BASELINE" "$RUNNER_TEMP/baseline.json"
            echo "::notice title=Baseline::usando o baseline deste commit (destino sem baseline ou evento sem PR)"
          fi

      - name: Gates (RNF09, guardrail legal, risco RF-IA03)
        run: |
          uv run python -m src.evaluation.gate \
            --report data/benchmark/baseline_report.json \
            --baseline "$RUNNER_TEMP/baseline.json" \
            --config eval/gates.toml

      - name: Verificação offline de gabaritos e schemas de respostas (Semana 3)
        run: |
          uv run pytest tests/test_avaliacao_respostas.py -q
          uv run python -m src.evaluation.gate --verificar-respostas

      # Salva no fim, mesmo se um passo falhar, o job for cancelado ou estourar o tempo: os lotes já
      # calculados (pelo pré-cálculo, pelos testes e pelo benchmark) não se perdem. Só salva o que mudou.
      - name: Conferir o que salvar nos caches
        id: salvar
        if: always()
        run: |
          depois=$(sha256sum "$VETORES_CACHE" 2>/dev/null | cut -c1-64)
          echo "vetores=$([ -n "$depois" ] && [ "$depois" != "$VETORES_SHA_ANTES" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "modelo=$([ -n "$(ls -A "$FASTEMBED_CACHE_PATH" 2>/dev/null)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Salvar os vetores pré-calculados
        if: always() && steps.salvar.outputs.vetores == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VETORES_CACHE }}
          key: vetores-e5-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Salvar o modelo de embeddings
        if: always() && steps.modelo.outputs.cache-hit != 'true' && steps.salvar.outputs.modelo == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-multilingual-e5-large-v1
