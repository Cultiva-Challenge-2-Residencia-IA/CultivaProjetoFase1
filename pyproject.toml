[project]
name = "nutri-evidence-consultant"
version = "0.1.0"
description = "Fase 1 (Baseline): Consultor de Nutrição Baseado em Evidências com RAG Híbrido e Guardrails Legais (Lei 8.234/91)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "pymupdf>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
