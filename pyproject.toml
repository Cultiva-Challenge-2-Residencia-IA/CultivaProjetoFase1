[project]
name = "nutri-evidence-consultant"
version = "0.1.0"
description = "Fase 1 (Baseline): Consultor de Nutrição Baseado em Evidências com RAG Híbrido e Guardrails Legais (Lei 8.234/91)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "pymupdf>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "networkx>=3.2",
    "pyyaml>=6.0.0",
    "pillow>=10.0.0",
    "chromadb>=1.0.0",
    "fastembed>=0.4.0",
    "langgraph>=1.2.23,<2",
]

[dependency-groups]
# Observabilidade opcional (src/observabilidade.py, ADR 0003): uv sync --group observabilidade
observabilidade = [
    "langfuse>=5.2.0",
]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff==0.14.0",
    "langfuse>=3.0.0",
]
# Comparação de modelos locais (issue #55): BERTScore de referência. Fora do CI:
# uv sync --group modelo-local
modelo-local = [
    "bert-score>=0.3.13",
    "torch>=2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.uv]
package = false

# PyTorch só para CPU (o grupo modelo-local não usa GPU, que fica com o Ollama).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
