[project]
name = "cultiva"
version = "0.1.0"
description = "CULTIVA: apoio educativo e organizacional de hábitos com IA, sem diagnóstico nem prescrição"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "langgraph>=0.2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# O tamanho de linha é responsabilidade do `ruff format`; regex longas ficam inteiras.
ignore = ["E501"]
