sparse_page_decisions:
  1: Capa com título e instituição como texto nativo; sem conteúdo a recuperar por OCR.
  2: Repetição da capa como texto nativo; sem conteúdo a recuperar por OCR.
  52: Contracapa sem texto nativo (logotipos); conferida no PDF, sem conteúdo do Guia.
# Títulos de capítulo: o extrator trocou o título de cada abertura de capítulo pelo cabeçalho
# corrente ("CAPÍTULO Ministério da Saúde N") e perdeu o nome do capítulo, que está no texto nativo.
# Sem ele, os Trechos de idosos saíam com a seção de adultos, e os de gestantes com "Para os pais
# ou responsáveis". O título é reconstruído do texto nativo da página, como título de nível 2.
